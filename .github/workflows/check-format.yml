name: Check Format

on: [push, pull_request]

jobs:
  check-format:

    runs-on: ubuntu-26.04
    container: debian:sid-slim

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y make clang-format gcc
    - name: Build
      run: make check-format
